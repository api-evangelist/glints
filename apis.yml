name: Glints
description: 'Glints is a talent recruitment and career development platform headquartered in Singapore
  and operating across Southeast Asia, including Indonesia, Vietnam, Malaysia, Taiwan and the Philippines.
  Founded in 2013, it runs an online job marketplace connecting job seekers with employers, a curated
  headhunting service (TalentHunt), and a cross-border managed-talent / remote-hiring offering that lets
  companies build and employ distributed teams across the region. Glints also publishes career resources
  and expert classes. It is one of the largest talent ecosystems in Southeast Asia and is backed by
  investors including DCM Ventures, Monk''s Hill Ventures and PERSOL. This API Evangelist profile was
  added as a portfolio-company lead; Glints exposes no public developer API at this time.'
